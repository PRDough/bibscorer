<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BibScorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 没有 Baskerville 的系统（Windows / 安卓）用 Libre Baskerville 代替 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- 页面头部 -->
        <header class="site-header">
            <a class="brand" href="/">BibScorer</a>
            <span class="tagline">Rank BibTeX references by keywords and meaning</span>
        </header>

        <!-- 主体内容 -->
        <main>
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            &copy; 2026 PRDough 🐈‍⬛ · <a href="https://github.com/PRDough/bibscore_web">Source on GitHub</a>
        </footer>
    </div>
</body>

</html>
